name: Test start step with payload and override
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          step: start
          token: ${{ github.token }}
          env: production
          desc: "Deploying to production"
          task: deploy
          override: 'true'
          payload: '{"version":"1.0.0","triggered_by":"ci"}'
          debug: 'true'

      - name: Assert action ran (start with payload succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DEPLOYMENT_ID: ${{ steps.action.outputs.deployment_id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deployment_id: $DEPLOYMENT_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DEPLOYMENT_ID" ]; then
              echo "FAIL: action succeeded but deployment_id output is empty"
              exit 1
            fi
            echo "PASS: deployment created with id '$DEPLOYMENT_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
