name: Test start step with override and custom options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          step: start
          token: ${{ github.token }}
          env: production
          override: 'true'
          ref: refs/heads/act-harness
          task: deploy
          logs: 'https://github.com/example/repo/actions/runs/1'
          desc: "Production deployment with override"
          payload: '{"version":"1.0.0"}'
          debug: 'true'

      - name: Assert action ran (deployment_id set, or failed gracefully on sentinel repo)
        env:
          DEPLOYMENT_ID: ${{ steps.action.outputs.deployment_id }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deployment_id: $DEPLOYMENT_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DEPLOYMENT_ID" ]; then
              echo "FAIL: action succeeded but deployment_id output is empty"
              exit 1
            fi
            echo "PASS: got deployment_id '$DEPLOYMENT_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
