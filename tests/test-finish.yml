name: Test finish step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          step: finish
          token: ${{ github.token }}
          env: staging
          status: success
          deployment_id: '123456789'
          env_url: 'https://staging.example.com'
          desc: "Deployment finished successfully"
          debug: 'true'

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or invalid deployment_id)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
